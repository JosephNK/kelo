# Flutter 스택 정의 — /kelo:setup 선택지와 kelo.yaml `stacks` 검증의 원본.
# 스택이 기여하는 산출물은 rules/flutter/<stack>/ 의 파일 존재로 정해진다:
#   conventions.md → CONVENTIONS.md, lint-rules-reference.md → LINT.md
# lintPackage: 선택 시 .kelo/plugins/ 에 vendoring 되는 analyzer 플러그인 (path는 저장소 루트 기준).
freezed:
  description: freezed 불변 모델 (Entity/State)
  lintPackage:
    name: freezed_lint
    path: rules/flutter/freezed/custom-lint/freezed_lint
go-router:
  description: GoRouter 라우팅
leaf-kit:
  description: FlutterLeafKit UI·유틸 키트
  lintPackage:
    name: leaf_kit_lint
    path: rules/flutter/leaf-kit/custom-lint/leaf_kit_lint
easy-localization:
  description: easy_localization 다국어
