# /kelo:setup 실행 단계 — scripts/kelo.mjs가 배열 순서대로 실행한다.
#
# 단계 종류
#   run: <스크립트 경로(scripts/ 기준)> <인자...>   — node로 실행, cwd = 프로젝트 루트
#   exec: <외부 명령>  (cwd: 프로젝트 기준 하위 경로)
#   builtin: ensure-package-json | move-app-to-src | install | peers | yarn-resolutions | format-docs
#   yarn-resolutions: { pin: ["<pkg>/<dep>"] } — yarn classic에서만 <dep>를 프로젝트 설치 버전으로 resolutions 고정
# 옵션
#   if: agents                — kelo.yaml 값이 true일 때만 실행
#   stacks: { flag, having }  — 선택 스택을 `<flag> a,b`로 덧붙임. having이 있으면
#                               rules/<framework>/<stack>/<having> 파일이 있는 스택만 (없으면 플래그 생략)
#   analysisPathFlag: <flag>  — setup --analysis-path <dir>가 주어지면 `<flag> <dir>`을 덧붙임 (개발용)
#   monorepoRootFlag: <flag>  — kelo.yaml이 workspaces 모드면 `<flag> <모노레포 루트>`를 덧붙임
#   scope: root               — 모노레포(kelo.yaml workspaces)에서는 워크스페이스가 아닌 루트에서 한 번만 실행.
#                               rootIfMissing 경로가 루트에 이미 있으면 건너뜀 (단일 프로젝트에서는 항상 실행)
# 치환: {framework} {name} {entryDir}
# 모노레포에서 install은 루트에서 한 번 실행되고, install 뒤 단계는 워크스페이스별로 이어서 실행된다.

steps:
  - builtin: move-app-to-src
  - builtin: ensure-package-json
  - run: gen-agents.mjs {framework} -p . -n {name} --docs-dir docs
    if: agents
  - run: gen-architecture.mjs {framework} -p docs
  - run: gen-conventions.mjs {framework} -p docs
    stacks: { flag: --with, having: conventions.md }
  - run: typescript/gen-eslint.mjs {framework} -p .
  - run: typescript/gen-stylelint.mjs {framework} -p .
  - run: typescript/gen-prettier.mjs {framework} -p .
  - run: typescript/gen-tsconfig.mjs {framework} -p .
    stacks: { flag: --with, having: tsconfig.patch.json }
  - run: gen-husky.mjs {framework} -p .
    scope: root
    rootIfMissing: .husky
  - run: gen-commitlint.mjs -p .
    scope: root
    rootIfMissing: commitlint.config.mjs
  - builtin: install
  - builtin: peers
    packages:
      - "eslint-plugin-boundaries@>=7"
      - eslint-import-resolver-typescript
      - eslint-plugin-simple-import-sort
      - eslint-plugin-unused-imports
      - eslint-plugin-sonarjs
      - eslint-config-prettier
      - "eslint-config-next@>=16"
  # sonarjs가 직접 의존성으로 선언한 TypeScript를 yarn classic이 따로 설치하면 타입 규칙이 깨진다
  - builtin: yarn-resolutions
    pin: [eslint-plugin-sonarjs/typescript]
  - builtin: format-docs
