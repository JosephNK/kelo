# kelo doctor — 미분류 파일(local/no-unknown-files)의 폴더별 이동 위치 제안.
# 위에서부터 처음 맞는 항목을 쓴다 (match: `**` 여러 세그먼트, `*` 한 세그먼트).
# 확신이 없는 폴더는 넣지 않는다 — 기본 안내(docs/ARCHITECTURE.md)로 떨어진다.
hints:
  - match: "src/features/*/**"
    suggest: "feature 단위로 나눠 src/domain/<feature>/{model,port,service,errors}.ts · src/http/<feature>/{repository,mapper,hook,factory}.ts · 화면은 src/app/[locale]/<route>/_components/"
  - match: "src/services/**"
    suggest: "비즈니스 로직은 src/domain/<feature>/service.ts, API 호출은 src/http/<feature>/repository.ts"
  - match: "src/repositories/**"
    suggest: "src/http/<feature>/repository.ts (Port 구현체) — 인터페이스는 src/domain/<feature>/port.ts"
  - match: "src/api/**"
    suggest: "src/http/<feature>/repository.ts (Port 구현체) — 생성 클라이언트는 src/http/_generated/"
  - match: "src/models/**"
    suggest: "src/domain/<feature>/model.ts"
  - match: "src/entities/**"
    suggest: "src/domain/<feature>/model.ts"
  - match: "src/types/**"
    suggest: "전역 타입은 src/lib/types/, API DTO는 src/http/_generated/types.ts, 도메인 타입은 src/domain/<feature>/model.ts"
  - match: "src/utils/**"
    suggest: "src/lib/utils/*.ts (순수 유틸, barrel은 src/lib/utils/index.ts)"
  - match: "src/helpers/**"
    suggest: "src/lib/utils/*.ts (순수 유틸)"
  - match: "src/lib/dictionaries/**"
    suggest: "src/i18n/dictionaries/<locale>.json (로더는 src/app/[locale]/dictionaries.ts)"
  - match: "src/http/*"
    suggest: "src/http/ 루트에는 client.ts만 둔다 — 수기 barrel(index.ts) 대신 각 파일을 직접 import"
  - match: "src/lib/*"
    suggest: "src/lib/utils/*.ts (순수 유틸) 또는 src/lib/types/"
  - match: "src/constants/**"
    suggest: "도메인 상수는 src/domain/<feature>/model.ts, 공용 상수는 src/lib/utils/*.ts"
  - match: "src/context/**"
    suggest: "src/app/[locale]/_providers/ (page-provider)"
  - match: "src/providers/**"
    suggest: "src/app/[locale]/_providers/ (page-provider)"
  - match: "src/store/**"
    suggest: "서버 상태는 src/http/<feature>/hook.ts (TanStack Query), 클라이언트 전역 상태는 src/app/[locale]/_providers/"
  - match: "src/stores/**"
    suggest: "서버 상태는 src/http/<feature>/hook.ts (TanStack Query), 클라이언트 전역 상태는 src/app/[locale]/_providers/"
  - match: "src/locales/**"
    suggest: "src/i18n/dictionaries/<locale>.json"
  - match: "src/http/*/*"
    suggest: "src/http/<feature>/ 에는 repository.ts · mapper.ts · hook.ts · factory.ts만 둔다"
  - match: "src/domain/*/*"
    suggest: "src/domain/<feature>/ 에는 model.ts · port.ts · service.ts · errors.ts만 둔다"
  - match: "app/**"
    suggest: "src/app/ 으로 이동 (/kelo:setup --move-app)"
