# kelo doctor — 미분류 파일(local/no-unknown-files)의 폴더별 이동 위치 제안.
# 위에서부터 처음 맞는 항목을 쓴다 (match: `**` 여러 세그먼트, `*` 한 세그먼트).
# 확신이 없는 폴더는 넣지 않는다 — 기본 안내(docs/ARCHITECTURE.md)로 떨어진다.
hints:
  - match: "src/modules/**/services/**"
    suggest: "service/ (단수 폴더, *.service.ts)"
  - match: "src/modules/**/controllers/**"
    suggest: "controller/ (단수 폴더, *.controller.ts)"
  - match: "src/modules/**/dtos/**"
    suggest: "dto/ (단수 폴더, *.dto.ts)"
  - match: "src/modules/**/entities/**"
    suggest: "ORM 엔티티는 provider/*.orm-entity.ts, 순수 도메인 모델은 model/"
  - match: "src/modules/**/entity/**"
    suggest: "ORM 엔티티는 provider/*.orm-entity.ts, 순수 도메인 모델은 model/"
  - match: "src/modules/**/repositories/**"
    suggest: "인터페이스는 port/*.port.ts, 구현은 provider/*.adapter.ts"
  - match: "src/modules/**/repository/**"
    suggest: "인터페이스는 port/*.port.ts, 구현은 provider/*.adapter.ts"
  - match: "src/modules/**/interfaces/**"
    suggest: "port/ (Port 인터페이스) 또는 model/ (도메인 타입)"
  - match: "src/modules/**/guards/**"
    suggest: "src/common/guards/ (전역) 또는 strategy/ (인증 전략)"
  - match: "src/modules/**/exceptions/**"
    suggest: "exception/ (단수 폴더, *.error.ts)"
  - match: "src/modules/**/models/**"
    suggest: "model/ (단수 폴더)"
  - match: "src/modules/**/providers/**"
    suggest: "provider/ (단수 폴더, *.adapter.ts)"
  - match: "src/modules/*/*"
    suggest: "모듈 루트에는 <domain>.module.ts만 — 나머지는 model·port·service·controller·strategy·provider·exception·dto·common 폴더로"
  - match: "src/common/**"
    suggest: "src/common/ 허용 하위 폴더(authentication·guards·exceptions·interfaces·middlewares·pipes·interceptors·decorators·events·dtos·config·utils·constants)로 옮기거나, 새 폴더면 kelo.lint.json boundaryElements에 등록"
  - match: "src/infrastructure/**"
    suggest: "외부 시스템 I/O면 infrastructure(database·i18n·cache·email·external), 아니면 infrastructure-shared(logger·metrics·transaction) 폴더로 — 새 폴더면 같은 기준으로 kelo.lint.json boundaryElements에 등록"
  - match: "src/config/**"
    suggest: "src/common/config/"
  - match: "src/utils/**"
    suggest: "src/common/utils/ (프레임워크 비의존이면) 또는 src/libs/"
  - match: "src/shared/**"
    suggest: "전역 공용은 src/common/<허용 폴더>/, 독립 라이브러리는 src/libs/"
  - match: "src/entities/**"
    suggest: "src/modules/<domain>/provider/*.orm-entity.ts"
  - match: "src/*/*.module.ts"
    suggest: "src/modules/<domain>/ 아래로 (레이어 폴더 구조)"
