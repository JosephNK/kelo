# vocabit 구조를 본뜬 검증용 nx 모노레포.
# apps/app(Flutter)은 Nx 타깃 정의용 package.json 만 가진다 (npm 의존성 없음).
packages:
  - apps/*

onlyBuiltDependencies:
  - nx
  - unrs-resolver

# 로컬 체크아웃 검증용 — 앱 package.json은 실제 사용자와 같은 레지스트리 버전을 쓰고,
# 설치만 로컬 tarball(scripts/pack-kelo-local.sh 생성, 버전 없는 고정 파일명)로 대체한다.
overrides:
  "eslint-config-kelo-nestjs": "file:.local-packages/eslint-config-kelo-nestjs.tgz"
  "eslint-config-kelo-nextjs": "file:.local-packages/eslint-config-kelo-nextjs.tgz"
  # 보안 패치 — 상위 패키지가 취약 버전을 고정 (@boundaries/elements → handlebars 4.7.9, nx 23.3 → undici 7.29.0)
  # minimatch·glob은 취약 범위(7~11.0.0, 9~14.0.1)만 올린다 — minimatch 3.x 사용처는 API가 달라 그대로 둔다
  "handlebars": "^4.7.10"
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
  "glob@>=9.0.0 <=14.0.1": "^14.0.2"
  "fast-uri": "^3.1.9"
  "body-parser": "^2.4.0"
  "multer": "^2.5.0"
  "nx>undici": "^7.29.1"
